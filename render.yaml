# Render Blueprint for the FastAPI backend (https://render.com/docs/blueprint-spec).
# The frontend is deployed separately on Vercel (see docs/DEPLOY.md).
services:
  - type: web
    name: supply-chain-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false            # entered in the Render dashboard, never committed
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DEFAULT_DATASET
        value: fmcg_clean.csv
      - key: BACKEND_CORS_ORIGINS
        sync: false            # your Vercel URL, e.g. https://supply-chain-dashboard.vercel.app
      - key: BACKEND_CORS_ORIGIN_REGEX
        sync: false            # optional, to allow preview deployments
